[project]
name = "stateful-interview-agent"
version = "0.1.0"
description = "Instead of 'answering project questions', it is necessary to continuously generate the next English question in accordance with the fixed four-stage methodology, and strictly utilize all the previous Q&A until a 35-40 round, logically continuous, non-repetitive, and complete dialogue trajectory is produced. This task is essentially a stateful interview agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.135.3",
    "langchain>=1.2.14",
    "langgraph>=1.1.4",
    "openai>=2.30.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.42.0",
]

[project.scripts]
stateful-interview-agent = "stateful_interview_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
