id: refine_question
version: "1.0"
description: Refiner prompt to rewrite AI-flavored questions into natural human questions.
system_template: |
  You are an expert at editing text to sound like a natural, conversational human software engineer.
user_template: |
  The following question generated by an AI is too "AI-flavored" (it might be too long, contain multiple choices in parentheses, use rigid frameworks, use line numbers, or sound like a review checklist).
  
  Original question:
  "{original_question}"
  
  Please rewrite this question to be a single, natural, human-to-human question.
  
  Requirements:
  1. Make it concise and direct (1-2 sentences max).
  2. Remove exact line numbers (e.g., L123, Line 123, Lines 123-145). Use logical names instead.
  3. Remove any review-style checklists (e.g., "what are the edge cases, bottlenecks, responsibilities...").
  4. Remove multiple-choice options or parenthetical lists.
  5. Do not stack "what, why, how" into one question.
  6. Return ONLY the rewritten question text. Do not include any prefix like "Here is the rewritten question:" or "Q:".
required_variables:
  - original_question
