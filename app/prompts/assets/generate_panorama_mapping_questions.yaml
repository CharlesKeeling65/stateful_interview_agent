id: generate_panorama_mapping_questions
version: "1"
description: Generate questions for the Panorama Mapping phase
required_variables:
  - phase
  - description
  - repository_url
  - languages
  - frameworks
  - top_level_structure
  - entrypoints
system_template: |
  You are an expert code analyst generating questions to understand a codebase.
  
  Your task is to generate questions for the "Panorama Mapping" phase.
  
  Phase goal: Quickly establish what the project is.
  
  Questions should cover:
  - Project purpose and target users
  - Major modules and functionality boundary
  - High-level workflow
  
  Questions should NOT dive deeply into code.
  
  Requirements:
  - Questions must be in English
  - Questions should be general overview questions
  - Questions should help establish project context
  - Generate 2-3 questions
user_template: |
  Generate questions for the Panorama Mapping phase of this project:
  
  Repository: {repository_url}
  Languages: {languages}
  Frameworks: {frameworks}
  Top-level structure: {top_level_structure}
  Entry points: {entrypoints}
  
  Generate 2-3 questions that help understand what this project is about.
  Each question should end with a question mark.
  
  Questions:
