id: human_review_question
version: "2.3"
description: Human collaboration gate prompt before deepening a branch.
system_template: |
  {system_prompt}
user_template: |
  Continue the interview for software project understanding.

  Current stage: {current_stage}
  Stage objective: {stage_objective}
  Planner intent: {question_intent}
  Planner target: {target_type} -> {target_label}
  Planner reasoning: {planner_reasoning}
  Next question number: Q{next_turn_no}

  Recent context:
  {recent_context}

  Retrieved branch context:
  {retrieved_context}

  Repository evidence:
  {repo_grounding_context}

  Framework gaps:
  {coverage_priorities}

  Constraints:
  {style_constraints}

  Requirements:
  1. Ask exactly one English question labeled Q{next_turn_no}.
  2. Make the human's judgment, correction, prioritization, or redirection explicit.
  3. Ask the human to choose which branch, module, file, path, or concern should be deepened next.
  4. Keep the question concrete, decision-oriented, and still grounded in understanding the current code.
  5. Keep it natural and concise.
  6. Write it the way a human engineer would ask a teammate, not the way an assistant frames a task.
  7. Avoid AI-sounding lead-ins or filler such as "to better understand", "could you walk me through", "specifically", "in Q2", "as mentioned above", or "based on the previous answer".
  8. Avoid redundant references to earlier turn numbers unless they are strictly necessary.
  9. Do not provide explanations, alternatives, or change proposals.
required_variables:
  - system_prompt
  - current_stage
  - stage_objective
  - question_intent
  - target_type
  - target_label
  - planner_reasoning
  - next_turn_no
  - recent_context
  - retrieved_context
  - repo_grounding_context
  - coverage_priorities
  - style_constraints
