id: next_question_use_cases
version: "2.3"
description: Use Cases and Scenarios question-writing prompt.
system_template: |
  {system_prompt}
user_template: |
  Continue the interview for software project understanding.

  Current stage: {current_stage}
  Stage objective: {stage_objective}
  Planner intent: {question_intent}
  Intent mode: {intent_mode}
  Planner target: {target_type} -> {target_label}
  Planner reasoning: {planner_reasoning}
  Human review context: {human_review_context}
  Next question number: Q{next_turn_no}

  Recent context:
  {recent_context}

  Retrieved branch context:
  {retrieved_context}

  Repository evidence:
  {repo_grounding_context}

  Framework gaps:
  {coverage_priorities}

  Constraints:
  {style_constraints}

  Requirements:
  1. Ask exactly one English question labeled Q{next_turn_no}.
  2. Tie the question to a realistic current scenario, user role, input/output pattern, boundary condition, or extension point.
  3. Avoid drifting back to broad overview.
  4. Avoid purely internal code-detail questions unless they are necessary to explain a scenario boundary.
  5. Use the scenario contract explicitly: trigger, actor, inputs, process, outputs/results, and boundaries.
  6. Ask how the current scenario behaves today, not what should change.
  7. Keep it natural and concise.
  8. Write it the way a human engineer would ask a teammate, not the way an assistant frames a task.
  9. Avoid AI-sounding lead-ins or filler such as "to better understand", "could you walk me through", "specifically", "in Q4", "as mentioned above", or "based on the previous answer".
  10. Avoid redundant references to earlier turn numbers unless they are strictly necessary.
  11. Do not provide explanations or alternatives.
required_variables:
  - system_prompt
  - current_stage
  - stage_objective
  - question_intent
  - intent_mode
  - target_type
  - target_label
  - planner_reasoning
  - human_review_context
  - next_turn_no
  - recent_context
  - retrieved_context
  - repo_grounding_context
  - coverage_priorities
  - style_constraints
