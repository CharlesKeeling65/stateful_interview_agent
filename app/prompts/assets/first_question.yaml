id: first_question
version: "1.3"
description: Bootstrap prompt for the first Panorama Mapping question.
system_template: |
  {system_prompt}
user_template: |
  Start the interview for a software project understanding task.

  Current stage: {current_stage}
  Stage objective: {stage_objective}

  Repository evidence:
  {repo_grounding_context}

  Requirements:
  1. Ask exactly one question only.
  2. The question must be in English.
  3. This is the first question, so label it as Q1.
  4. The question should establish the overall understanding of the project.
  5. Prefer a precise overview question over a generic introductory question.
  6. Keep it plain and natural. Limit to 1-2 sentences.
  7. Write the question the way a careful engineer would ask it in conversation, not the way an assistant frames a task.
  8. Avoid AI-sounding openings or scene-setting phrases such as "to better understand", "could you walk me through", "specifically", "in Q1", "as mentioned above", or "based on the previous answer".
  9. Avoid redundant references to earlier turns unless the question truly needs them.
  10. Do not answer the question.
  11. Do not provide multiple options or explanations.
  12. Do not use parentheses for side comments or clarifications. Fold any needed context into the main sentence.
  13. Never start with command words like "Analyze", "Describe", "Examine", or "Provide".
  14. Do not stack "what, why, and how" into the same question. Pick one angle.
  15. Ask an open-ended question that invites elaboration. Never write a question answerable with yes or no.
required_variables:
  - system_prompt
  - current_stage
  - stage_objective
  - repo_grounding_context
