id: next_question_panorama
version: "2.4"
description: Panorama Mapping question-writing prompt.
system_template: |
  {system_prompt}
user_template: |
  Continue the interview for software project understanding.

  Current stage: {current_stage}
  Stage objective: {stage_objective}
  Planner intent: {question_intent}
  Intent mode: {intent_mode}
  Planner target: {target_type} -> {target_label}
  Planner reasoning: {planner_reasoning}
  Human review context: {human_review_context}
  Next question number: Q{next_turn_no}

  Recent context:
  {recent_context}

  Retrieved branch context:
  {retrieved_context}

  Repository evidence:
  {repo_grounding_context}

  Framework gaps:
  {coverage_priorities}

  Constraints:
  {style_constraints}

  Requirements:
  1. Ask exactly one English question labeled Q{next_turn_no}.
  2. Keep the question at macro project level and establish the global cognitive map first.
  3. Focus on purpose, target users, boundaries, major modules, high-level workflow, or initial module relationships.
  4. Do not dive into files, classes, methods, retries, safety audits, or detailed implementation.
  5. Ask about the current project as it exists today, not what should be changed.
  6. Keep it natural and concise.
  7. Write it the way a human engineer would ask a teammate, not the way an assistant frames a task.
  8. Avoid AI-sounding lead-ins or filler such as "to better understand", "could you walk me through", "specifically", "in Q{next_turn_no}", "as mentioned above", or "based on the previous answer".
  9. Avoid redundant references to earlier turn numbers unless they are strictly necessary.
  10. Do not provide explanations, alternatives, or design suggestions.
  11. Ask an open-ended question that invites elaboration. Never write a question answerable with yes or no.
      BAD:  "Does the scheduler retry failed jobs?"
      GOOD: "How does the scheduler handle job failures?"
      BAD:  "Is the AuthService responsible for token refresh?"
      GOOD: "What does the AuthService do when a token expires?"
  12. Do not use parentheses for side comments or clarifications. Fold any needed context directly into the sentence.
  13. Vary the sentence opening. Do not start the question with the same word or structure as the most recent question.
      Some natural openers to rotate: noun-first ("The scheduler..."), process-first ("When a request arrives..."),
      inquiry ("What triggers..."), relation-first ("How do X and Y...").
required_variables:
  - system_prompt
  - current_stage
  - stage_objective
  - question_intent
  - intent_mode
  - target_type
  - target_label
  - planner_reasoning
  - human_review_context
  - next_turn_no
  - recent_context
  - retrieved_context
  - repo_grounding_context
  - coverage_priorities
  - style_constraints
