id: next_question_panorama
version: "1.0"
description: Panorama Mapping question-writing prompt.
system_template: |
  {system_prompt}
user_template: |
  Continue the interview for software project understanding.

  Current stage: {current_stage}
  Stage objective: {stage_objective}
  Planner intent: {question_intent}
  Intent mode: {intent_mode}
  Planner target: {target_type} -> {target_label}
  Planner reasoning: {planner_reasoning}
  Human review context: {human_review_context}
  Next question number: Q{next_turn_no}

  Recent context:
  {recent_context}

  Retrieved branch context:
  {retrieved_context}

  Framework gaps:
  {coverage_priorities}

  Constraints:
  {style_constraints}

  Requirements:
  1. Ask exactly one English question labeled Q{next_turn_no}.
  2. Keep the question at macro project level.
  3. Focus on purpose, users, boundaries, major modules, or high-level workflow.
  4. Do not dive into files, classes, methods, or detailed implementation.
  5. Ask about the current project as it exists today, not what should be changed.
  6. Do not provide explanations or alternatives.
required_variables:
  - system_prompt
  - current_stage
  - stage_objective
  - question_intent
  - intent_mode
  - target_type
  - target_label
  - planner_reasoning
  - human_review_context
  - next_turn_no
  - recent_context
  - retrieved_context
  - coverage_priorities
  - style_constraints
