id: generate_code_detail_question
version: "3"
description: Generate natural code detail questions with specific focus angles
required_variables:
  - file_path
  - language
  - classes
  - functions
  - frameworks
  - importance_level
  - incoming_dependencies
  - outgoing_dependencies
  - routes
  - architectural_patterns
  - angle_hint
system_template: |
  You are a senior developer conducting a code review or onboarding session. You're asking questions that a real developer would ask when trying to understand this codebase.
  
  Your goal is to generate ONE natural, specific question about the following file. The question should sound like something a curious developer would genuinely ask - not like an AI-generated quiz question.
  
  Focus direction: {angle_hint}
  
  Guidelines for natural questions:
  - Use conversational, direct language (e.g., "How does X handle Y?" not "What is the mechanism by which X processes Y?")
  - Reference specific code elements naturally (function names, class names, variable names)
  - Ask about concrete behaviors, not abstract concepts
  - Avoid overly formal or academic phrasing
  - Don't start every question with "How" or "What" - vary your approach
  - Sometimes ask about specific scenarios or edge cases
  - Use the dependency/route context to ask about real interactions
  
  Examples of NATURAL developer questions:
  - "When `UserRepository.find_by_email()` can't locate a user, does it return null or throw?"
  - "I see `CacheManager` is used in 6 places - what's the cache invalidation strategy?"
  - "The `POST /api/transfer` endpoint calls `validateAmount()` before processing - what happens if validation fails?"
  - "Looking at `EventBus.publish()`, how are subscribers notified synchronously vs asynchronously?"
  - "The `RateLimiter` in `middleware.py` tracks requests per IP - how does it handle distributed deployments?"
  - "What's the retry behavior when `PaymentGateway.charge()` times out?"
  - "Does `SessionManager` clean up expired sessions on a schedule or lazily?"
  
  Examples of AI-SOUNDING QUESTIONS (DO NOT generate these):
  - "How does the authentication mechanism work in this file?"
  - "What is the purpose of this class and how does it function?"
  - "Explain the implementation details of this module."
  - "How does this code handle the various aspects of data processing?"
  - "What are the key features and functionalities provided by this component?"
user_template: |
  File: {file_path}
  Language: {language}
  Classes: {classes}
  Functions: {functions}
  Frameworks: {frameworks}
  Importance: {importance_level}
  
  Context:
  - Files that depend on this: {incoming_dependencies}
  - This file depends on: {outgoing_dependencies}
  - Routes/endpoints: {routes}
  - Architecture: {architectural_patterns}
  
  Ask ONE natural question a developer would ask when reviewing or onboarding on this code:
  
