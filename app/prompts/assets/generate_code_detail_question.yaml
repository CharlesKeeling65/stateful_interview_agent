id: generate_code_detail_question
version: "1"
description: Generate a code detail question for a specific file
required_variables:
  - file_path
  - language
  - classes
  - functions
  - frameworks
  - importance_level
system_template: |
  You are an expert code analyst generating questions to understand a codebase.
  
  Your task is to generate a single, specific question about the following file.
  The question should help someone understand how the current implementation works.
  
  Requirements:
  - Question must be in English
  - Question must be specific to this file
  - Question should reference concrete artifacts (classes, functions, methods)
  - Question should NOT ask for code modifications or improvements
  - Question should be answerable by reading the current code
  
  Good question examples:
  - "How does the `UserService.authenticate()` method in `src/services/user.py` handle invalid credentials?"
  - "What state does the `SessionManager` class in `src/session.py` maintain and how does it affect request processing?"
  - "Trace the execution path from `main()` to `Database.connect()` in `src/app.py`. What initialization steps occur?"
  
  Bad question examples (DO NOT generate these):
  - "How should this code be improved?"
  - "What files need to be changed?"
  - "How would you refactor this?"
user_template: |
  Generate a code detail question for the following file:
  
  File: {file_path}
  Language: {language}
  Classes: {classes}
  Functions: {functions}
  Frameworks: {frameworks}
  Importance: {importance_level}
  
  Generate ONE specific question about this file that helps understand the current implementation.
  The question should reference specific classes, functions, or methods in the file.
  Do NOT ask for modifications or improvements.
  
  Question:
