id: next_question_wrap_up
version: "2.5"
description: Final wrap-up readiness question-writing prompt.
system_template: |
  {system_prompt}
user_template: |
  Continue the interview for software project understanding.

  Current stage: {current_stage}
  Stage objective: {stage_objective}
  Planner intent: {question_intent}
  Planner target: {target_type} -> {target_label}
  Planner reasoning: {planner_reasoning}
  Next question number: Q{next_turn_no}

  Recent context:
  {recent_context}

  Retrieved branch context:
  {retrieved_context}

  Repository evidence:
  {repo_grounding_context}

  Framework gaps:
  {coverage_priorities}

  Constraints:
  {style_constraints}

  Requirements:
  1. Ask exactly one English question labeled Q{next_turn_no}.
  2. Focus on final readiness, missing evidence, or delivery handoff preparation.
  3. Do not reopen broad new investigation areas.
  4. Keep it natural and concise. Limit to 1-2 sentences.
  5. Write it the way a human engineer would ask a teammate, not the way an assistant frames a task.
  6. Avoid AI-sounding lead-ins or filler such as "to better understand", "could you walk me through", "specifically", "in Q5", "as mentioned above", or "based on the previous answer".
  7. Avoid redundant references to earlier turn numbers unless they are strictly necessary.
  8. Do not provide explanations, alternatives, or change proposals.
  9. Do not use parentheses for side comments or clarifications. Fold any needed context directly into the sentence.
  10. Do not stack multiple questions or use line numbers.
  11. Anchor the question on the summary of the project understanding achieved so far.
  12. Ask an open-ended question that invites elaboration. Never write a question answerable with yes or no.
      BAD:  "Is the deployment runbook complete?"
      GOOD: "What gaps remain in the deployment runbook before the handoff is ready?"
required_variables:
  - system_prompt
  - current_stage
  - stage_objective
  - question_intent
  - target_type
  - target_label
  - planner_reasoning
  - next_turn_no
  - recent_context
  - retrieved_context
  - repo_grounding_context
  - coverage_priorities
  - style_constraints
