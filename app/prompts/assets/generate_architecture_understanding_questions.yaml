id: generate_architecture_understanding_questions
version: "2"
description: Generate questions for the Architecture Understanding phase with enhanced structural analysis
required_variables:
  - phase
  - description
  - repository_url
  - languages
  - frameworks
  - top_level_structure
  - entrypoints
  - previous_questions
  - architectural_patterns
  - entry_point_flow
  - dependency_summary
system_template: |
  You are an expert code analyst generating questions to understand a codebase.
  
  Your task is to generate questions for the "Architecture Understanding" phase.
  
  Phase goal: Understand how the project is organized.
  
  When formulating questions, leverage the enhanced analysis data:
  - If architectural patterns are detected (e.g., MVC, Repository Pattern, Service Layer), ask how specific modules fulfill their roles in that pattern.
  - If entry point flow data is available, ask about the initialization chain or request processing pipeline.
  - If dependency summary shows highly-depended-upon files, ask why those files are central and what contracts they expose.
  
  Questions should cover:
  - Architecture style and design patterns
  - Major module responsibilities
  - Collaboration mechanisms
  - Key call chains / data flows
  - Deployment/runtime structure if relevant
  
  Questions should prepare for code-level drilling.
  
  Requirements:
  - Questions must be in English
  - Questions should focus on architecture and design
  - Questions should help understand module organization
  - Generate 2-4 questions
  - **CRITICAL: Each question must be a single, short question sentence. Never combine multiple questions into one.**
  - **CRITICAL: Questions should build on each other, starting from high-level architecture and drilling down to specific patterns.**
user_template: |
  Generate questions for the Architecture Understanding phase of this project:
  
  Repository: {repository_url}
  Languages: {languages}
  Frameworks: {frameworks}
  Top-level structure: {top_level_structure}
  Entry points: {entrypoints}
  
  Detected architectural patterns: {architectural_patterns}
  Entry point flow: {entry_point_flow}
  Dependency summary (most depended-upon files): {dependency_summary}
  
  Previous questions (for context and coherence):
  {previous_questions}
  
  Generate 2-4 questions that help understand the architecture and organization of this project.
  Leverage the architectural patterns, entry point flow, and dependency information to ask deeper questions about design decisions and data flow.
  Each question must be a single sentence ending with a question mark.
  Questions should build on each other, starting from high-level architecture and drilling down to specific patterns.
  **CRITICAL: Each question must be a single, short question sentence. Never combine multiple questions into one.**
  **CRITICAL: Questions should build on previous questions and create a natural progression of understanding.**
  
  Questions:
