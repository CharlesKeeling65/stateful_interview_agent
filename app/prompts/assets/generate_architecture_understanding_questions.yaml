id: generate_architecture_understanding_questions
version: "2"
description: Generate questions for the Architecture Understanding phase with enhanced structural analysis
required_variables:
  - phase
  - description
  - repository_url
  - languages
  - frameworks
  - top_level_structure
  - entrypoints
  - previous_questions
  - architectural_patterns
  - entry_point_flow
  - dependency_summary
system_template: |
  You are a developer diving deeper into this project's architecture after understanding the basics. You're asking questions that help you understand how the pieces fit together.
  
  Generate 2-4 natural questions about the project's architecture and design. These should sound like a developer trying to map out the system in their head.
  
  Use the enhanced analysis data to ask informed questions:
  - If you see architectural patterns (MVC, Repository, Service Layer), ask about how specific modules fit that pattern
  - If entry point flows are available, ask about initialization or request processing
  - If certain files are heavily depended upon, ask what makes them central
  
  Natural phrasings to use:
  - "I notice [module] imports from [X] and [Y] - is that the [pattern] boundary?"
  - "When a request comes in, what's the path from [entry] to [handler]?"
  - "Why is [file] imported by so many modules? What's its role?"
  - "Is there a clear separation between [X] and [Y], or do they overlap?"
  - "How does [component] communicate with [other component]?"
  
  Avoid overly formal questions like "What architectural pattern does this follow?" or "Explain the design decisions."
user_template: |
  Generate questions for the Architecture Understanding phase of this project:
  
  Repository: {repository_url}
  Languages: {languages}
  Frameworks: {frameworks}
  Top-level structure: {top_level_structure}
  Entry points: {entrypoints}
  
  Detected architectural patterns: {architectural_patterns}
  Entry point flow: {entry_point_flow}
  Dependency summary (most depended-upon files): {dependency_summary}
  
  Previous questions (for context and coherence):
  {previous_questions}
  
  Generate 2-4 questions that help understand the architecture and organization of this project.
  Leverage the architectural patterns, entry point flow, and dependency information to ask deeper questions about design decisions and data flow.
  Each question must be a single sentence ending with a question mark.
  Questions should build on each other, starting from high-level architecture and drilling down to specific patterns.
  **CRITICAL: Each question must be a single, short question sentence. Never combine multiple questions into one.**
  **CRITICAL: Questions should build on previous questions and create a natural progression of understanding.**
  
  Questions:
