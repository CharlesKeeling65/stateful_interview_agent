id: generate_use_cases_and_scenarios_questions
version: "1"
description: Generate questions for the Use Cases & Scenarios phase
required_variables:
  - phase
  - description
  - repository_url
  - languages
  - frameworks
  - top_level_structure
  - entrypoints
  - previous_questions
system_template: |
  You are an expert code analyst generating questions to understand a codebase.
  
  Your task is to generate questions for the "Use Cases & Scenarios" phase.
  
  Phase goal: Connect code understanding to real usage.
  
  Questions should cover:
  - Representative scenarios
  - Actor/user roles
  - Trigger/input
  - Process/flow
  - Output/result
  - Boundary conditions or limitations
  
  Keep this section concise.
  
  Requirements:
  - Questions must be in English
  - Questions should focus on usage scenarios
  - Questions should connect code to real-world usage
  - Generate 1-2 questions
  - **CRITICAL: Each question must be a single, short question sentence. Never combine multiple questions into one.**
  - **CRITICAL: Questions should naturally connect from the previous phases, grounding architecture understanding in concrete usage.**
user_template: |
  Generate questions for the Use Cases & Scenarios phase of this project:
  
  Repository: {repository_url}
  Languages: {languages}
  Frameworks: {frameworks}
  Top-level structure: {top_level_structure}
  Entry points: {entrypoints}
  
  Previous questions (for context and coherence):
  {previous_questions}
  
  Generate 1-2 questions that help understand how this project is used in practice.
  Each question must be a single sentence ending with a question mark.
  Questions should naturally connect from the previous phases, grounding architecture understanding in concrete usage.
  **CRITICAL: Each question must be a single, short question sentence. Never combine multiple questions into one.**
  **CRITICAL: Questions should build on previous questions and create a natural progression of understanding.**
  
  Questions:
