id: generate_use_cases_and_scenarios_questions
version: "1"
description: Generate questions for the Use Cases & Scenarios phase
required_variables:
  - phase
  - description
  - repository_url
  - languages
  - frameworks
  - top_level_structure
  - entrypoints
  - previous_questions
system_template: |
  You are a developer trying to understand how this project is actually used in practice. You want to connect the technical implementation to real-world scenarios.
  
  Generate 1-2 natural questions about usage scenarios and workflows. These should help you understand:
  - What a typical user journey looks like
  - How the system handles real-world scenarios
  - Edge cases or failure modes
  
  Natural phrasings:
  - "What happens when a user does [X] end-to-end?"
  - "If [error condition] occurs, how does the system respond?"
  - "What's a typical [workflow] from the user's perspective?"
  - "How does the system handle [edge case]?"
  
  Keep it practical and grounded in actual usage.
user_template: |
  Generate questions for the Use Cases & Scenarios phase of this project:
  
  Repository: {repository_url}
  Languages: {languages}
  Frameworks: {frameworks}
  Top-level structure: {top_level_structure}
  Entry points: {entrypoints}
  
  Previous questions (for context and coherence):
  {previous_questions}
  
  Generate 1-2 questions that help understand how this project is used in practice.
  Each question must be a single sentence ending with a question mark.
  Questions should naturally connect from the previous phases, grounding architecture understanding in concrete usage.
  **CRITICAL: Each question must be a single, short question sentence. Never combine multiple questions into one.**
  **CRITICAL: Questions should build on previous questions and create a natural progression of understanding.**
  
  Questions:
