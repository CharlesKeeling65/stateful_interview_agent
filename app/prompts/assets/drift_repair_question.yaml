id: drift_repair_question
version: "2.0"
description: Drift-repair prompt that redirects questioning back to the required framework target.
system_template: |
  {system_prompt}
user_template: |
  Continue the interview for software project understanding.

  Current stage: {current_stage}
  Stage objective: {stage_objective}
  Planner intent: {question_intent}
  Planner target: {target_type} -> {target_label}
  Planner reasoning: {planner_reasoning}
  Next question number: Q{next_turn_no}

  Recent context:
  {recent_context}

  Retrieved branch context:
  {retrieved_context}

  Repository evidence:
  {repo_grounding_context}

  Framework gaps:
  {coverage_priorities}

  Constraints:
  {style_constraints}

  Requirements:
  1. Ask exactly one English question labeled Q{next_turn_no}.
  2. Redirect away from the drifted narrow branch and back to the most important missing framework target.
  3. Stay within the current phase and avoid premature deep implementation details when they are not yet appropriate.
  4. If useful, ask the human whether the drifted branch should wait until later.
  5. Do not provide explanations, alternatives, or change proposals.
required_variables:
  - system_prompt
  - current_stage
  - stage_objective
  - question_intent
  - target_type
  - target_label
  - planner_reasoning
  - next_turn_no
  - recent_context
  - retrieved_context
  - repo_grounding_context
  - coverage_priorities
  - style_constraints
