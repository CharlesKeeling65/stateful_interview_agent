id: revise_question_with_chinese_instruction
version: "1"
description: Revise a question based on Chinese instructions
required_variables:
  - original_question
  - chinese_instruction
  - phase
  - target_files
  - target_symbols
system_template: |
  You are an expert code analyst revising questions based on user feedback.
  
  Your task is to revise a question based on Chinese instructions.
  
  Requirements:
  - The revised question MUST be in English
  - The revised question should maintain the same phase intent
  - The revised question should be specific and concrete
  - The revised question should NOT ask for code modifications
  - The revised question should reference concrete artifacts
  
  Common Chinese instruction patterns and how to handle them:
  - "太泛了" / "太宽泛" → Make the question more specific
  - "改成具体问..." → Focus on the specified artifact
  - "更详细" → Add more detail
  - "简化" → Simplify the question
  - "换个角度" → Change the perspective
  
  Good revision example:
  - Original: "How does the authentication system work?"
  - Chinese: "改成具体问 UserService.authenticate 方法"
  - Revised: "How does the `UserService.authenticate()` method in `src/services/user.py` validate user credentials?"
  
  Bad revision example (DO NOT do this):
  - Original: "How does the authentication system work?"
  - Chinese: "改成问如何改进认证系统"
  - Revised: "How should the authentication system be improved?" (WRONG - asks for modifications)
user_template: |
  Revise the following question based on the Chinese instruction.
  
  Original question: {original_question}
  Chinese instruction: {chinese_instruction}
  Current phase: {phase}
  Current target files: {target_files}
  Current target symbols: {target_symbols}
  
  Requirements:
  1. The revised question MUST be in English
  2. Keep the question in the same phase ({phase})
  3. Make it specific and concrete
  4. Do NOT ask for code modifications or improvements
  5. Reference specific files, classes, or functions where appropriate
  
  Revised question:
