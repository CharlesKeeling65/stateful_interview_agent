id: next_question_code_detail
version: "2.5"
description: Code Detail Completion question-writing prompt.
system_template: |
  {system_prompt}
user_template: |
  Continue the interview for software project understanding.

  Current stage: {current_stage}
  Stage objective: {stage_objective}
  Planner intent: {question_intent}
  Intent mode: {intent_mode}
  Planner target: {target_type} -> {target_label}
  Planner reasoning: {planner_reasoning}
  Human review context: {human_review_context}
  Next question number: Q{next_turn_no}

  Recent context:
  {recent_context}

  Retrieved branch context:
  {retrieved_context}

  Repository evidence:
  {repo_grounding_context}

  Framework gaps:
  {coverage_priorities}

  Constraints:
  {style_constraints}

  Requirements:
  1. Ask exactly one English question labeled Q{next_turn_no}.
  2. The question must be implementation-specific.
  3. It must reference a concrete file, class, function, method, execution path, library usage site, or error-handling path.
  4. It must ask how the current implementation works right now, not how it should be changed.
  5. It must not ask a vague summary question such as "How is this implemented overall?"
  6. It must not ask for redesigns, improvements, modifications, or test updates.
  7. Prefer concrete code artifacts over abstract design wording, and prefer tracing current behavior over discussing future changes.
  8. Keep it focused, direct, and natural. It can be moderately detailed when needed, but avoid bloated multi-clause wording.
  9. Write it the way a human engineer would ask a teammate, not the way an assistant frames a task.
  10. Avoid AI-sounding lead-ins or filler such as "to better understand", "could you walk me through", "specifically", "in Q7", "as mentioned above", or "based on the previous answer".
  11. Avoid redundant references to earlier turn numbers unless they are strictly necessary.
  12. Use exactly one sentence and exactly one question mark.
  13. Do not provide explanations, alternatives, or implementation proposals.
  14. Ask an open-ended question that invites elaboration. Never write a question answerable with yes or no.
      BAD:  "Does the retry handler use exponential backoff?"
      GOOD: "How does the retry handler decide the delay between attempts?"
      BAD:  "Is the connection pool configured in db.py?"
      GOOD: "Where in db.py is the connection pool configured, and what parameters control its size?"
  15. Do not use parentheses for side comments or clarifications. Fold any needed context directly into the sentence.
required_variables:
  - system_prompt
  - current_stage
  - stage_objective
  - question_intent
  - intent_mode
  - target_type
  - target_label
  - planner_reasoning
  - human_review_context
  - next_turn_no
  - recent_context
  - retrieved_context
  - repo_grounding_context
  - coverage_priorities
  - style_constraints
