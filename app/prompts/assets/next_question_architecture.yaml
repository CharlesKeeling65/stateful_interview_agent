id: next_question_architecture
version: "2.0"
description: Architecture Understanding question-writing prompt.
system_template: |
  {system_prompt}
user_template: |
  Continue the interview for software project understanding.

  Current stage: {current_stage}
  Stage objective: {stage_objective}
  Planner intent: {question_intent}
  Intent mode: {intent_mode}
  Planner target: {target_type} -> {target_label}
  Planner reasoning: {planner_reasoning}
  Human review context: {human_review_context}
  Next question number: Q{next_turn_no}

  Recent context:
  {recent_context}

  Retrieved branch context:
  {retrieved_context}

  Repository evidence:
  {repo_grounding_context}

  Framework gaps:
  {coverage_priorities}

  Constraints:
  {style_constraints}

  Requirements:
  1. Ask exactly one English question labeled Q{next_turn_no}.
  2. Focus on responsibilities, collaboration mechanisms, key call chains, or system structure.
  3. Avoid repeating shallow overview questions once panorama is already established.
  4. Avoid broad code-detail questions unless tied to a concrete call path or component interaction.
  5. Stay in understand-current-code mode: ask how the current structure and interactions work.
  6. Do not ask for redesigns, refactors, proposed modifications, or test updates.
  7. Do not provide explanations, alternatives, or change proposals.
required_variables:
  - system_prompt
  - current_stage
  - stage_objective
  - question_intent
  - intent_mode
  - target_type
  - target_label
  - planner_reasoning
  - human_review_context
  - next_turn_no
  - recent_context
  - retrieved_context
  - repo_grounding_context
  - coverage_priorities
  - style_constraints
