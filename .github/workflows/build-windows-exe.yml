name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/build-windows-exe.yml"
      - "app/**"
      - "frontend/**"
      - "packaging/windows/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --extra build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Windows bundle
        run: uv run pyinstaller packaging/windows/stateful_interview_agent.spec --noconfirm

      - name: Prepare distributable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/StatefulInterviewAgent/data | Out-Null
          New-Item -ItemType Directory -Force -Path dist/StatefulInterviewAgent/logs | Out-Null
          Copy-Item .env.example dist/StatefulInterviewAgent/.env.example

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: StatefulInterviewAgent-windows
          path: dist/StatefulInterviewAgent
          if-no-files-found: error

      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/StatefulInterviewAgent/* -DestinationPath dist/StatefulInterviewAgent-windows.zip -Force

      - name: Publish tagged release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StatefulInterviewAgent-windows.zip
